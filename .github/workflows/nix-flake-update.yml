name: Nix Flake Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get app user uid
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      
      - name: Setup Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-platforms = aarch64-linux

      - name: Nix Flake Update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        id: check-changes
        run: |
          git worktree add ../main
          git checkout -B nix-flake-update

          nix flake update --commit-lock-file

          # check if changes were made
          if git diff --quiet HEAD@{1} HEAD; then
            echo "No updates available."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          git push origin nix-flake-update --force

      - name: Build closures
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          eval "$(nix print-dev-env .#deploy)"

          colmena build --no-build-on-target
          colmena eval -E '{ nodes, lib, ... }: lib.attrsets.mapAttrs (k: v: v.config.system.build.toplevel.outPath) nodes' > ".store-paths"

          cd ../main
          colmena build --no-build-on-target
          colmena eval -E '{ nodes, lib, ... }: lib.attrsets.mapAttrs (k: v: v.config.system.build.toplevel.outPath) nodes' > ".store-paths"


      - name: Build new closures and diff
        if: steps.check-changes.outputs.changed == 'true'
        id: generate-diff
        run: |
          nix shell nixpkgs#dix nixpkgs#jq -c bash -c '
            for host in $(cat .store-paths | jq -r "keys[]"); do
              echo "Evaluating new closure for $host..."
              OLD_PATH=$(cat ../main/.store-paths | jq '.["$host"]')
              NEW_PATH=$(cat .store-paths | jq '.["$host"]')

              
              echo "" >> pr-body.md
              echo "### Host: `$host`" >> pr-body.md
              echo "```" >> pr-body.md
              
              dix diff "$OLD_PATH" "$NEW_PATH" >> pr-body.md
              
              echo "```" >> pr-body.md
            done
          '

      - name: Submit PR
        if: steps.check-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! gh pr view nix-flake-update &>/dev/null; then
            gh pr create \
              --head nix-flake-update \
              --base main \
              --title "nix flake update" \
              --body-file pr-body.md
          else
            gh pr edit nix-flake-update --body-file pr-body.md

