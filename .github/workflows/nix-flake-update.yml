name: Nix Flake Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get app user uid
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      
      - name: Setup Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ vars.NIKS3_SERVER }}

      - name: Nix Flake Update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        id: check-changes
        run: |
          git checkout -B nix-flake-update

          nix flake update --commit-lock-file --option commit-lockfile-summary "nix flake update"

          # check if changes were made
          if git diff --quiet HEAD@{1} HEAD; then
            echo "No updates available."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          git push origin nix-flake-update --force

      - name: Eval drvPaths
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          # new
          nix eval .#nixosConfigurations --json --apply 'builtins.mapAttrs (name: value: value.config.system.build.toplevel.drvPath)' > ".drv-paths"

          # old
          git fetch origin main
          git worktree add ../main origin/main
          cd ../main
          nix eval .#nixosConfigurations --json --apply 'builtins.mapAttrs (name: value: value.config.system.build.toplevel.drvPath)' > ".drv-paths"

      - name: Generate Diffs
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          for host in $(jq -r 'keys | join(" ")' .drv-paths); do
            echo "generating diff for $host..."
            OLD_DRV=$(jq -r --arg host "$host" '.[$host]' ../main/.drv-paths)
            NEW_DRV=$(jq -r --arg host "$host" '.[$host]' .drv-paths)

            echo "" >> pr-body.md
            echo "### Host: \`$host\`" >> pr-body.md
            echo "\`\`\`" >> pr-body.md
            
            nix run nixpkgs#dix $OLD_DRV $NEW_DRV >> pr-body.md
            
            echo "\`\`\`" >> pr-body.md
          done

      - name: Submit PR
        if: steps.check-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --head nix-flake-update \
            --base main \
            --title "nix flake update" \
            --body-file pr-body.md || \
          gh pr edit nix-flake-update --body-file pr-body.md

