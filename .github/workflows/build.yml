name: Build and Cache

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  checks: write
  id-token: write

concurrency:
  group: build-${{ github.ref || github.head_ref }}
  cancel-in-progress: true

jobs:
  atelier:
    uses: stepbrobd/atelier/.github/workflows/discover.yaml@master

  diff:
    if: github.ref_name == 'nix-flake-update'
    needs: atelier
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get app user uid
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      
      - name: Setup Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-platforms = aarch64-linux

      - name: Build closures
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          eval "$(nix print-dev-env .#deploy)"

          # new
          nix eval .#nixosConfigurations --json --apply 'builtins.mapAttrs (name: value: value.config.system.build.toplevel.outPath)' > ".store-paths"

          # old
          cd ../main
          nix eval .#nixosConfigurations --json --apply 'builtins.mapAttrs (name: value: value.config.system.build.toplevel.outPath)' > ".store-paths"

      - name: Build new closures and diff
        if: steps.check-changes.outputs.changed == 'true'
        id: generate-diff
        run: |
          nix shell nixpkgs#dix nixpkgs#jq -c bash -c '
            for host in $(cat .store-paths | jq -r "keys[]"); do
              echo "Evaluating new closure for $host..."
              OLD_PATH=$(cat ../main/.store-paths | jq '.["$host"]')
              NEW_PATH=$(cat .store-paths | jq '.["$host"]')

              # pull paths from cache
              nix copy --from https://cache.kafu.observer OLD_PATH NEW_PATH
              
              echo "" >> pr-body.md
              echo "### Host: `$host`" >> pr-body.md
              echo "```" >> pr-body.md
              
              dix diff "$OLD_PATH" "$NEW_PATH" >> pr-body.md
              
              echo "```" >> pr-body.md
            done
          '

      - name: Submit PR
        if: steps.check-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! gh pr view nix-flake-update &>/dev/null; then
            gh pr create \
              --head nix-flake-update \
              --base main \
              --title "nix flake update" \
              --body-file pr-body.md
          else
            gh pr edit nix-flake-update --body-file pr-body.md
